name: Release

# 三种触发：推送到 main = 构建验证（不发版）；推送 v* tag = 构建并创建
# Release；Actions 页面手动触发 = 同构建验证。发版步骤以 refs/tags/ 前缀
# 守卫，只有 tag 推送才会产出 Release 与附件。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 同组运行互斥：新运行自动取消仍在进行的旧运行（npm ci 在 ubuntu-26.04
# 新镜像上存在停滞数分钟不退出的场景，避免占住并发额度）
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release 需要对仓库的写权限

jobs:
  release:
    # 钉住成熟镜像：ubuntu-latest 已切到 ubuntu-26.04（2026-11 起），
    # 其上 npm ci 停滞数分钟后以 "Exit handler never called" 崩溃且退出码为 0，
    # 导致 node_modules 残缺、后续 tsc: not found
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          # Node 20 捆绑的 npm 10.8.2 在本仓库 npm ci 时崩溃
          #（"Exit handler never called"，node_modules 残缺且退出码为 0，
          # 后续 tsc: not found）；Node 22 的 npm 已修复，与本地开发版本一致
          node-version: '22'
          cache: 'npm'

      - name: 安装后端依赖
        run: npm ci --ignore-scripts

      - name: 安装前端依赖
        run: npm ci --prefix frontend --ignore-scripts

      - name: 构建前端（vite build）
        run: npm run build --prefix frontend

      - name: 构建后端（tsc）
        run: npm run build

      - name: 预览 tarball 内容（校验 files 白名单）
        run: npm pack --dry-run --ignore-scripts

      - name: 打包 tarball
        run: npm pack --ignore-scripts   # 跳过 prepack 重复构建（前面已构建）

      - name: 重命名为带 tag 版本
        if: startsWith(github.ref, 'refs/tags/')
        run: mv sse-inspector-*.tgz sse-inspector-${{ github.ref_name }}.tgz

      - name: 创建 Release 并上传 tarball
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sse-inspector-${{ github.ref_name }}.tgz
          generate_release_notes: true   # 自动根据 commits 生成 Release 说明
